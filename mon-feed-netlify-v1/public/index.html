<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c0f14">
  <title>MON FEED</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="topline">
      <div class="brand"><span id="liveDot" class="dot loading"></span><div><h1>MON FEED</h1><small id="freshness">Connexion au feed…</small></div></div>
      <button id="refresh" class="icon-btn" title="Recharger le feed" aria-label="Recharger">↻</button>
    </div>
    <div id="categories" class="chips"></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Rechercher dans les actus…" autocomplete="off">
      <select id="sourceFilter"><option value="all">Toutes les sources</option></select>
      <select id="readFilter"><option value="all">Tous</option><option value="unread">Non lus</option><option value="read">Lus</option></select>
      <select id="sort"><option value="new">Plus récentes</option><option value="clickbait">Plus putaclic</option><option value="source">Par source</option></select>
    </div>
  </header>

  <main>
    <section class="panel feed-panel">
      <div class="panel-head"><h2>📰 Actualités</h2><span id="count" class="muted">—</span></div>
      <div id="feed" class="feed"><div class="empty">Chargement…</div></div>
    </section>

    <aside>
      <section class="panel stats">
        <div><b id="statAll">0</b><span>articles</span></div>
        <div><b id="statUnread">0</b><span>non lus</span></div>
        <div><b id="statFav">0</b><span>favoris</span></div>
      </section>
      <section class="panel sources-panel">
        <div class="panel-head"><h2>📡 Sources</h2><span id="sourceSummary" class="muted">—</span></div>
        <div id="sources" class="sources"></div>
      </section>
    </aside>
  </main>
</div>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
