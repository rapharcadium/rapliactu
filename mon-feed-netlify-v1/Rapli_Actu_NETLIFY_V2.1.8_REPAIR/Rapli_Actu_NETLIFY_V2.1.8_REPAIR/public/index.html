<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Rapli Actu</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles-v218.css?v=2.1.8">
</head>
<body>
<div class="app">
<header>
  <div class="topline">
    <div class="brand"><span class="brand-mark"><img class="brand-logo" src="/brand-logo.png" alt=""><span id="liveDot" class="dot brand-status"></span></span><div><h1>Rapli Actu</h1><small id="freshness">Chargement…</small></div></div>
    <button class="icon-btn" id="refresh" title="Actualiser">↻</button>
  </div>
  <div class="controls">
    <div class="select-wrap"><select id="categoryFilter"><option>Tous les thèmes</option></select></div>
    <select id="sourceFilter"><option value="all">Toutes les sources</option></select>
    <select id="readFilter"><option value="all">Tout afficher</option><option value="unread">Non lus</option><option value="read">Déjà lus</option></select>
  </div>
  <button id="newBanner" class="new-banner" type="button">↑ <span id="newCount">Nouvelles actus</span></button>
</header>
<main>
  <section class="panel feed-panel">
    <div class="panel-head"><h2>📰 Actualités</h2><span id="count" class="muted">—</span></div>
    <div id="feed" class="feed"><div class="empty">Chargement du feed…</div></div>
    <div class="history-actions"><button id="loadMore" class="load-more" type="button">Charger les actualités précédentes</button></div>
  </section>
  <aside>
    <section class="panel stats"><div><b id="statAll">0</b><span>chargées</span></div><div><b id="statUnread">0</b><span>non lues</span></div></section>
    <section class="panel sources-panel"><div class="panel-head"><h2>📡 Sources</h2><span id="sourceSummary" class="muted">—</span></div><div id="sources" class="sources"></div></section>
  </aside>
</main>
</div>
<script src="/assets/app-v218.js?v=2.1.8" defer></script>
</body>
</html>
